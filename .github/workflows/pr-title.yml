# PR 제목이 커밋 규칙을 지키는지 검사한다.
#
# 머지는 merge commit 이라 PR 제목이 머지 커밋 메시지 두 번째 줄로 남는다.
# 브랜치 안 커밋 하나하나는 lefthook commit-msg 훅이 로컬에서 검사한다 —
# 훅이 안 깔린 환경에서 만든 커밋은 여기서 잡히지 않는다.
# GitHub 룰셋의 커밋 메시지 규칙은 Enterprise 전용이라 쓸 수 없다.
name: PR 제목 검사

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: 접두사와 한국어 요약 확인
        env:
          # 제목을 run 안에 ${{ }} 로 직접 넣으면 제목에 쓴 셸 문법이 실행된다. 환경변수로만 넘긴다
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          title = os.environ["TITLE"]
          head = os.environ["HEAD_REF"]
          # develop → main PR 은 묶음이라 접두사 규칙 대신 "release:" 로 시작하면 통과
          prefixes = "feat|fix|style|refactor|test|docs|chore|db|release"
          ok_prefix = re.match(rf"^({prefixes})(\([^)]+\))?: \S", title)
          ok_korean = re.search(r"[가-힣]", title)
          if ok_prefix and ok_korean:
              print(f"통과: {title}")
              sys.exit(0)
          print(f"::error::PR 제목 규칙 위반: {title!r}")
          print("형식: <접두사>: <한국어 요약>   예) feat: 큐레이션 모달에 날짜 선택 추가")
          print(f"접두사: {prefixes.replace('|', ', ')}")
          if head == "develop":
              print("develop → main 이면 예) release: 1차 시연판 (검증 연출·큐레이션)")
          sys.exit(1)
          PY
