[project]
name = "tabidori-contracts"
version = "0.1.0"
description = "약속의 원본 — API·그래프·MCP·화면 부품의 모양 (Pydantic)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabidori_contracts"]
