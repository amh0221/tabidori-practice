# git 훅 — 커밋 직전에 내 컴퓨터에서 미리 검사한다. CI가 서버에서 잡을 것을 먼저 잡는다.
# 설치: 저장소 루트에서 npm install (prepare 가 lefthook install 을 실행)
# 건너뛰기(--no-verify)는 가능하지만, 같은 검사를 CI가 다시 하므로 PR에서 걸린다.

pre-commit:
  parallel: true
  commands:
    python-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    python-lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    frontend-format:
      root: "frontend/"
      # 자동 생성 파일·락파일은 frontend/.prettierignore 가 건너뛴다
      glob: "*.{ts,tsx,css,json,md,html}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    frontend-lint:
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: npx oxlint {staged_files}

commit-msg:
  commands:
    korean-message:
      run: node scripts/check-commit-msg.mjs {1}
